name : Deploy Cloud Library to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::268335032548:role/GitHubActions-CloudLibrary-Deploy
          aws-region: us-east-1

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://cloud-library-terraform-hninyi-2026  \
            --delete  \
            --exclude ".git/*"  \
            --exclude ".github/*" \
            --exclude "terraform/*" \
            --exclude "README.md" \
            --exclude ".gitignore"

      - name: Invalidate CloudFront cache
        run:  |
          aws cloudfront create-invalidation  \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"  \
            --paths "/*"  